# AgentFlow Ingress + cert-manager 自动 TLS
# 使用 nginx-ingress-controller，TLS 证书由 Let's Encrypt 通过 cert-manager 签发

---
# ClusterIssuer：Let's Encrypt prod 环境签发器
# cert-manager 需要先安装：kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.14.0/cert-manager.yaml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@example.com # 改成你的运维邮箱
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentflow-api
  namespace: agentflow
  annotations:
    # 自动用 letsencrypt-prod 签发证书
    cert-manager.io/cluster-issuer: 'letsencrypt-prod'
    # SSE 流式响应需要的 nginx 参数
    nginx.ingress.kubernetes.io/proxy-buffering: 'off' # 关闭缓冲，让 token 实时推
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300' # 长 LLM 响应超时 5 分钟
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    # 让 Ingress 把 X-Forwarded-* header 透传给后端
    nginx.ingress.kubernetes.io/use-forwarded-headers: 'true'
    # 限制单 IP 请求速率（粗粒度，业务层有更精细的限流）
    nginx.ingress.kubernetes.io/limit-rps: '100'
    nginx.ingress.kubernetes.io/limit-connections: '50'
    # CORS 配置（前端独立部署时需要）
    nginx.ingress.kubernetes.io/enable-cors: 'true'
    nginx.ingress.kubernetes.io/cors-allow-methods: 'GET, POST, PUT, DELETE, OPTIONS'
    nginx.ingress.kubernetes.io/cors-allow-credentials: 'true'
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.agentflow.example.com
      secretName: agentflow-api-tls
  rules:
    - host: api.agentflow.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentflow-api
                port:
                  number: 80
