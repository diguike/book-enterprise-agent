# AgentFlow Temporal Worker Deployment
# Worker 不接 HTTP 流量，由 Temporal Server push task

apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentflow-temporal-worker
  namespace: agentflow
  labels:
    app: agentflow-temporal-worker
    component: worker
spec:
  replicas: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  selector:
    matchLabels:
      app: agentflow-temporal-worker
  template:
    metadata:
      labels:
        app: agentflow-temporal-worker
        component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: agentflow/worker:v1.0.0
          imagePullPolicy: IfNotPresent
          # healthcheck 端口
          ports:
            - containerPort: 9091
              name: health
          env:
            - name: NODE_ENV
              value: production
            # Temporal Server 集群内地址
            - name: TEMPORAL_SERVER
              value: 'temporal-frontend.temporal.svc.cluster.local:7233'
            - name: TEMPORAL_NAMESPACE
              value: 'agentflow'
            # 单 Worker 进程并发执行的 Activity 数
            # 受 CPU、LLM rate limit 限制，不能无限大
            - name: WORKER_CONCURRENCY
              value: '20'
            # task queue 名字，与 Workflow 端启动参数对应
            - name: WORKER_TASK_QUEUE
              value: 'agentflow-default'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agentflow-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: agentflow-secrets
                  key: redis-url
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-keys
                  key: anthropic
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-keys
                  key: openai
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: 'http://otel-collector.observability.svc.cluster.local:4318'
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          # Worker 没有 readiness（不接 Service 流量）
          # 只需要 liveness 确认进程活着
          livenessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # preStop：留 10 秒让指标导出器 flush
          # 真正触发 Worker 优雅关闭的是 K8s 在 preStop 结束后发的 SIGTERM
          # Temporal SDK 收到 SIGTERM 会停止 poll 新任务、跑完正在执行的 Activity
          lifecycle:
            preStop:
              exec:
                command: ['sh', '-c', 'sleep 10']
      # Worker 退出要等正在跑的 Activity 跑完
      # Activity 最长可能 5 分钟（长 LLM 调用），grace period 给 300 秒
      terminationGracePeriodSeconds: 300
      imagePullSecrets:
        - name: regcred
---
# Worker HPA：按 Temporal task queue backlog 扩缩
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agentflow-worker-hpa
  namespace: agentflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agentflow-temporal-worker
  minReplicas: 3
  maxReplicas: 30
  metrics:
    # Temporal task queue 的 backlog 数量（自定义指标）
    - type: External
      external:
        metric:
          name: temporal_task_queue_backlog
          selector:
            matchLabels:
              task_queue: agentflow-default
        target:
          type: AverageValue
          averageValue: '50'
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
