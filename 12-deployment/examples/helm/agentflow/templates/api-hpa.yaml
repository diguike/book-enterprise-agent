{{- if and .Values.api.enabled .Values.api.autoscaling.enabled -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "agentflow.fullname" . }}-api
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "agentflow.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "agentflow.fullname" . }}-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
    {{- range .Values.api.autoscaling.customMetrics }}
    - type: External
      external:
        metric:
          name: {{ .name }}
          selector:
            matchLabels:
              queue: {{ .queue }}
        target:
          type: AverageValue
          averageValue: {{ .averageValue | quote }}
    {{- end }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      # 5 分钟稳定窗口防抖
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "agentflow.fullname" . }}-api
  namespace: {{ .Values.global.namespace }}
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agentflow.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      component: api
{{- end }}
