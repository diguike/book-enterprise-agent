{{- if .Values.api.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentflow.fullname" . }}-api
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "agentflow.labels" . | nindent 4 }}
    component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      # 保证容量不降
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agentflow.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      component: api
  template:
    metadata:
      labels:
        {{- include "agentflow.labels" . | nindent 8 }}
        component: api
      annotations:
        {{- if .Values.observability.prometheusScrape }}
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3000'
        prometheus.io/path: '/metrics'
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: api
          image: {{ include "agentflow.image" (dict "Values" .Values "name" .Values.api.image.name) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '3000'
            - name: TEMPORAL_SERVER
              value: {{ .Values.temporal.server | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.otelEndpoint | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: redis-url
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-keys
                  key: anthropic
          envFrom:
            - configMapRef:
                name: {{ include "agentflow.fullname" . }}-config
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ['sh', '-c', 'sleep {{ .Values.api.preStopSleepSeconds }}']
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentflow.fullname" . }}-api
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "agentflow.labels" . | nindent 4 }}
    component: api
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "agentflow.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    component: api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: 3000
{{- end }}
